{% set name = "django-auditlog" %}
{% set version = "3.4.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: c4682982f2a7e18867a0893b4242fcc1608ed8256a1ddf885b5f80120addc2a3

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools-scm
    - pip
    - setuptools
  run:
    - freezegun
    - python >={{ python_min }}
    - django >=4.2
    - python-dateutil >=2.7.0

test:
  imports:
    - auditlog
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/jazzband/django-auditlog
  summary: Audit log app for Django
  dev_url: https://github.com/jazzband/django-auditlog
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rxm7706
